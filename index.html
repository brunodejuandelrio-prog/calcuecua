<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CALCUECUA UNIVERSAL</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        h1 {
            color: #1d63ed;
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: #1d63ed;
        }
        button {
            width: 100%;
            background-color: #1d63ed;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:disabled {
            background-color: #a0aec0;
        }
        .resultado-bloque {
            margin-top: 20px;
            padding: 15px;
            border-left: 5px solid #48bb78;
            background-color: #f0fff4;
            border-radius: 8px;
        }
        .titulo-analisis {
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 10px;
        }
        .estado {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 CALCUECUA UNIVERSAL</h1>
    <input type="text" id="expresion" placeholder="Ej: 2x^2 - 1/2 = 0" value="2x^2 - 1/2 = 0">
    <button id="btn-calcular" onclick="enviarCalculo()" disabled>Cargando motor matemático...</button>
    
    <div id="resultado-bloque" class="resultado-bloque" style="display:none;">
        <div class="titulo-analisis">🔹 CÁLCULO ANALIZADO:</div>
        <div id="contenido-resultado"></div>
    </div>
    <div id="status" class="estado">Iniciando Python...</div>
</div>

<script>
    let pyodideInstance = null;

    async function initPyodide() {
        try {
            pyodideInstance = await loadPyodide();
            document.getElementById('status').innerText = "Cargando SymPy (librería)...";
            await pyodideInstance.loadPackage("sympy");
            
            await pyodideInstance.runPythonAsync(`
from sympy import sympify, solve, symbols, Rational
import sympy as sp
import re

x, y, z = symbols('x y z')

def super_traductor(texto):
    # 1. Limpieza inicial de espacios extraños
    texto = texto.strip()
    
    # 2. Normalizar POTENCIAS (Convierte '^' o la palabra 'power' en '**')
    texto = re.sub(r'\\s*power\\s*', '**', texto, flags=re.IGNORECASE)
    texto = texto.replace('^', '**')
    
    # 3. MULTIPLICACIONES IMPLÍCITAS (Añadir el '*' oculto)
    # Número seguido de letra: 2x -> 2*x
    texto = re.sub(r'(\\d)([a-zA-Z])', r'\\1*\\2', texto)
    # Letra seguida de número: x2 -> x*2
    texto = re.sub(r'([a-zA-Z])(\\d)', r'\\1*\\2', texto)
    # Número seguido de paréntesis: 2(x+1) -> 2*(x+1)
    texto = re.sub(r'(\\d)\\(', r'\\1*(', texto)
    # Paréntesis seguido de letra: (x+1)x -> (x+1)*x
    texto = re.sub(r'\\)([a-zA-Z])', r')*\\1', texto)
    # Paréntesis seguido de paréntesis: (x+1)(x-2) -> (x+1)*(x-2)
    texto = re.sub(r'\\)\\(', r')*(', texto)
    
    return texto
            `);
            
            document.getElementById('btn-calcular').innerText = "Calcular ahora";
            document.getElementById('btn-calcular').disabled = false;
            document.getElementById('status').innerText = "⚡ Motor local listo (Modo Inteligente)";
        } catch (error) {
            document.getElementById('status').innerText = "❌ Error al cargar el motor local";
            console.error(error);
        }
    }

    async function enviarCalculo() {
        const entrada = document.getElementById('expresion').value.trim();
        if (!entrada || !pyodideInstance) return;

        const bloque = document.getElementById('resultado-bloque');
        const contenido = document.getElementById('contenido-resultado');
        
        bloque.style.display = "block";
        contenido.innerHTML = "<em>Traduciendo y calculando...</em>";

        try {
            pyodideInstance.globals.set("entrada_usuario", entrada);
            
            let resultado = await pyodideInstance.runPythonAsync(`
def procesar():
    try:
        # Traducir la entrada del usuario automáticamente
        entrada_limpia = super_traductor(entrada_usuario)
        
        # Evaluar con SymPy forzando el modo fraccionario/racional exacto (evaluate=True)
        # transformations='all' permite que SymPy entienda divisiones de enteros como fracciones exactas
        from sympy.parsing.sympy_parser import parse_expr, standard_transformations, implicit_multiplication_application
        transformaciones = standard_transformations
        
        if '=' in entrada_limpia:
            partes = entrada_limpia.split('=')
            izq = parse_expr(partes[0], transformations=transformaciones)
            der = parse_expr(partes[1], transformations=transformaciones)
            ecuacion = sp.Eq(izq, der)
            solucion = solve(ecuacion)
            return str(solucion)
        else:
            expresion = parse_expr(entrada_limpia, transformations=transformaciones)
            return str(expresion)
            
    except Exception as e:
        return f"Error matemático: {str(e)}"

procesar()
            `);

            contenido.innerHTML = `<div style="font-size: 18px; color: #2d3748; font-family: monospace; font-weight: bold;">${resultado}</div>`;
        } catch (err) {
            contenido.innerHTML = `<span style="color: #e53e3e;">❌ Error crítico en el analizador</span>`;
        }
    }

    initPyodide();
</script>

</body>
</html>
