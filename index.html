<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CALCUECUA UNIVERSAL</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        h1 {
            color: #1d63ed;
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: #1d63ed;
        }
        button {
            width: 100%;
            background-color: #1d63ed;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:disabled {
            background-color: #a0aec0;
        }
        .resultado-bloque {
            margin-top: 20px;
            padding: 20px;
            border-left: 5px solid #48bb78;
            background-color: #f0fff4;
            border-radius: 8px;
        }
        .titulo-analisis {
            font-weight: bold;
            color: #2d3748;
            font-size: 16px;
            margin-bottom: 12px;
            border-bottom: 1px dashed #cbd5e0;
            padding-bottom: 5px;
        }
        .paso {
            background: rgba(255, 255, 255, 0.7);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 15px;
            color: #4a5568;
            line-height: 1.5;
        }
        .resultado-final {
            font-size: 18px;
            color: #1a202c;
            font-weight: bold;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 2px solid #48bb78;
        }
        .estado {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 CALCUECUA UNIVERSAL</h1>
    <input type="text" id="expresion" placeholder="Ej: 2x + 4 = 10 o x^2 - 5x + 6 = 0" value="x^2 - 5x + 6 = 0">
    <button id="btn-calcular" onclick="enviarCalculo()" disabled>Cargando motor matemático...</button>
    
    <div id="resultado-bloque" class="resultado-bloque" style="display:none;">
        <div class="titulo-analisis">📝 RESOLUCIÓN PASO A PASO:</div>
        <div id="contenido-resultado"></div>
    </div>
    <div id="status" class="estado">Iniciando Python...</div>
</div>

<script>
    let pyodideInstance = null;

    async function initPyodide() {
        try {
            pyodideInstance = await loadPyodide();
            document.getElementById('status').innerText = "Cargando SymPy (librería)...";
            await pyodideInstance.loadPackage("sympy");
            
            await pyodideInstance.runPythonAsync(`
from sympy import sympify, solve, symbols, Poly, Eq
import sympy as sp
import re

x, y, z = symbols('x y z')

def super_traductor(texto):
    texto = texto.strip()
    texto = re.sub(r'\\s*power\\s*', '**', texto, flags=re.IGNORECASE)
    texto = texto.replace('^', '**')
    texto = re.sub(r'(\\d)([a-zA-Z])', r'\\1*\\2', texto)
    texto = re.sub(r'([a-zA-Z])(\\d)', r'\\1*\\2', texto)
    texto = re.sub(r'(\\d)\\(', r'\\1*(', texto)
    texto = re.sub(r'\\)([a-zA-Z])', r')*\\1', texto)
    texto = re.sub(r'\\)\\(', r')*(', texto)
    return texto
            `);
            
            document.getElementById('btn-calcular').innerText = "Calcular ahora";
            document.getElementById('btn-calcular').disabled = false;
            document.getElementById('status').innerText = "⚡ Motor local listo";
        } catch (error) {
            document.getElementById('status').innerText = "❌ Error al cargar el motor local";
            console.error(error);
        }
    }

    async function enviarCalculo() {
        const entrada = document.getElementById('expresion').value.trim();
        if (!entrada || !pyodideInstance) return;

        const bloque = document.getElementById('resultado-bloque');
        const contenido = document.getElementById('contenido-resultado');
        
        bloque.style.display = "block";
        contenido.innerHTML = "<em>Analizando y resolviendo...</em>";

        try {
            pyodideInstance.globals.set("entrada_usuario", entrada);
            
            let resultado_html = await pyodideInstance.runPythonAsync(`
def procesar_con_pasos():
    try:
        entrada_limpia = super_traductor(entrada_usuario)
        from sympy.parsing.sympy_parser import parse_expr, standard_transformations
        
        if '=' not in entrada_limpia:
            expr = parse_expr(entrada_limpia, transformations=standard_transformations)
            return f'<div class="paso"><b>Operación directa:</b> Se simplifica la expresión original.</div><div class="resultado-final">Resultado: {expr}</div>'
        
        # Separar lados del igual
        partes = entrada_limpia.split('=')
        izq = parse_expr(partes[0], transformations=standard_transformations)
        der = parse_expr(partes[1], transformations=standard_transformations)
        
        # Pasar todo al lado izquierdo (igualar a cero)
        eq_expr = izq - der
        pasos = []
        pasos.append(f'<div class="paso"><b>Paso 1: Igualar a cero.</b> Pasamos todo al lado izquierdo:<br><code>{izq} - ({der}) = 0</code></div>')
        
        eq_simplificada = sp.simplify(eq_expr)
        pasos.append(f'<div class="paso"><b>Paso 2: Simplificar términos semejantes.</b> La ecuación agrupada queda:<br><code>{eq_simplificada} = 0</code></div>')
        
        # Intentar analizar el grado de la ecuación usando Poly
        try:
            polinomio = Poly(eq_simplificada, x)
            grado = polinomio.degree()
        except:
            grado = None
            
        soluciones = solve(Eq(eq_simplificada, 0))
        
        if grado == 1:
            pasos.append('<div class="paso"><b>Paso 3: Ecuación de primer grado.</b> Despejamos la variable <code>x</code> aislando el término numérico.</div>')
        elif grado == 2:
            # Extraer coeficientes a, b, c
            a = polinomio.all_coeffs()[0]
            b = polinomio.all_coeffs()[1] if len(polinomio.all_coeffs()) > 1 else 0
            c = polinomio.all_coeffs()[2] if len(polinomio.all_coeffs()) > 2 else 0
            pasos.append(f'<div class="paso"><b>Paso 3: Ecuación de segundo grado de la forma ax² + bx + c = 0.</b><br>Identificamos los coeficientes:<br>• <b>a</b> = {a}<br>• <b>b</b> = {b}<br>• <b>c</b> = {c}</div>')
            pasos.append(f'<div class="paso"><b>Paso 4: Aplicar fórmula general.</b> Calculamos el discriminante (b² - 4ac):<br><code>({b})² - 4*({a})*({c}) = {b**2 - 4*a*c}</code></div>')
            
        if not soluciones:
            pasos.append('<div class="resultado-final">Resultado: No existen soluciones reales para esta ecuación.</div>')
        elif len(soluciones) == 1:
            pasos.append(f'<div class="resultado-final">¡Solución encontrada!<br>x = {soluciones[0]}</div>')
        else:
            lista_sols = " o ".join([f"x = {s}" for s in soluciones])
            pasos.append(f'<div class="resultado-final">¡Soluciones encontradas!<br>{lista_sols}</div>')
            
        return "".join(pasos)
            
    except Exception as e:
        return f'<div class="paso" style="color:#e53e3e;">Error al descomponer los pasos: {str(e)}</div>'

procesar_con_pasos()
            `);

            contenido.innerHTML = resultado_html;
        } catch (err) {
            contenido.innerHTML = `<span style="color: #e53e3e;">❌ Error crítico en el analizador de pasos</span>`;
        }
    }

    initPyodide();
</script>

</body>
</html>
