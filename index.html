 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CALCUECUA">
    <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=180&h=180&q=80">
    
    <title>CALCUECUA</title>
    
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 20px; 
            background-color: #f9f9fb; 
            color: #1c1c1e; 
            margin: 0; 
        }
        .header { 
            text-align: center; 
            border-bottom: 2px solid #007aff; 
            padding-bottom: 10px; 
            margin-bottom: 25px; 
            margin-top: 30px; 
        }
        .header h1 { 
            color: #007aff; 
            margin: 0; 
            font-size: 28px; 
            letter-spacing: 0.5px;
        }
        .input-container {
            margin-bottom: 20px;
        }
        .input-box { 
            width: 100%; 
            padding: 16px; 
            font-size: 17px; 
            border-radius: 12px; 
            border: 1px solid #c7c7cc; 
            box-sizing: border-box; 
            background-color: white;
            transition: border-color 0.2s;
        }
        .input-box:focus {
            outline: none;
            border-color: #007aff;
        }
        .btn { 
            width: 100%; 
            background-color: #007aff; 
            color: white; 
            padding: 16px; 
            font-size: 17px; 
            border: none; 
            border-radius: 12px; 
            font-weight: 600; 
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,122,255,0.2);
        }
        .btn:active {
            background-color: #0056b3;
        }
        .bloque-resultado { 
            background: white; 
            padding: 20px; 
            border-radius: 14px; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.06); 
            margin-top: 25px; 
            border-left: 5px solid #34c759; 
            display: none; 
        }
        .titulo-analisis { 
            font-size: 16px;
            font-weight: bold; 
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px; 
        }
        .solucion { 
            font-size: 24px; 
            padding: 12px 0; 
            text-align: center; 
            overflow-x: auto;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚀 CALCUECUA UNIVERSAL</h1>
    </div>
    
    <div class="input-container">
        <input type="text" id="expresion" class="input-box" placeholder="Escribe tu cálculo o sistema (ej: x+y=5, x-y=1)">
    </div>
    
    <button class="btn" onclick="enviarCalculo()">Calcular ahora</button>

    <div id="resultado-bloque" class="bloque-resultado">
        <div class="titulo-analisis">🔹 Cálculo analizado:</div>
        <div id="contenido-resultado"></div>
    </div>

    <script>
        async function enviarCalculo() {
            const entrada = document.getElementById('expresion').value;
            if (!entrada) return;
            
            const bloque = document.getElementById('resultado-bloque');
            const contenido = document.getElementById('contenido-resultado');
            
            contenido.innerHTML = '<div class="solucion" style="color: #8e8e93; font-size: 18px;">⏳ Procesando con SymPy...</div>';
            bloque.style.display = 'block';

            try {
                // Aquí cambiaremos esta URL local por la tuva de Render en el siguiente paso
                const urlServidor = 'https://calcuecua.onrender.com/'; 
                
                const respuesta = await fetch(urlServidor, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ expresion: entrada })
                });
                
                const datos = await respuesta.json();
                contenido.innerHTML = '';
                
                if (datos.error) {
                    contenido.innerHTML = `<div class="solucion" style="color: #ff3b30; font-size: 18px;">❌ ${datos.error}</div>`;
                } else {
                    datos.resultados.forEach(r => {
                        contenido.innerHTML += `<div class="solucion">${r}</div>`;
                    });
                }
            } catch (err) {
                contenido.innerHTML = '<div class="solucion" style="color: #ff3b30; font-size: 18px;">❌ Error de conexión con el motor matemático</div>';
            }
            
            // Re-renderizar las fórmulas matemáticas preciosas con MathJax
            if (window.MathJax) {
                MathJax.typeset();
            }
        }
    </script>
</body>
</html>
